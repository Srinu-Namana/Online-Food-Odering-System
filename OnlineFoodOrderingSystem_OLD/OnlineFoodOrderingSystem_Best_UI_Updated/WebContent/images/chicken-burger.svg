<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Chicken Burger">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="900" height="520" rx="34" fill="url(#g)"/>
  <circle cx="760" cy="95" r="92" fill="#C2410C" opacity=".10"/>
  <circle cx="120" cy="430" r="120" fill="#C2410C" opacity=".08"/>
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="350" rx="235" ry="62" fill="#1f2937" opacity=".12"/>
    <ellipse cx="450" cy="300" rx="220" ry="125" fill="#fff"/>
    <ellipse cx="450" cy="290" rx="190" ry="98" fill="#C2410C" opacity=".14"/>
  </g>
  <text x="450" y="292" text-anchor="middle" font-size="92" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🍔</text>
  <text x="450" y="410" text-anchor="middle" font-size="38" font-family="Arial, sans-serif" font-weight="700" fill="#182230">Chicken Burger</text>
  <text x="450" y="450" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3" fill="#C2410C">BURGER</text>
</svg>